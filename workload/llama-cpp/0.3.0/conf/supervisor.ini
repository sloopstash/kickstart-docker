[program:llama-cpp]
command=/opt/llama-cpp/bin/llama-server --model %(ENV_LLAMA_MODEL)s --host %(ENV_LLAMA_HOST)s --port %(ENV_LLAMA_PORT)s --n-gpu-layers %(ENV_LLAMA_N_GPU_LAYERS)s
process_name=%(program_name)s
directory=/opt/llama-cpp
pidfile=/opt/llama-cpp/system/server.pid
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/llama-cpp/log/server.log
stderr_logfile=/opt/llama-cpp/log/server-error.log