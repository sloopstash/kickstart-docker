storage:
  tsdb:
    # path: /opt/prometheus/data
global:
  scrape_native_histograms: true
  scrape_interval: 10s
  scrape_timeout: 10s
  evaluation_interval: 20s
  query_log_file: /opt/prometheus/log/query.log
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
  - job_name: "system"
    static_configs:
      - targets: ["localhost:9091"]
        labels:
          app: "node_exporter"
  - job_name: "docker"
    static_configs:
      - targets: ["localhost:9092"]
        labels:
          app: "cadvisor"
  - job_name: "kubernetes"
    static_configs:
      - targets: ["localhost:9093"]
        labels:
          app: "cadvisor"
rule_files:
alerting:
  alertmanagers:
    - static_configs:
        - targets:
